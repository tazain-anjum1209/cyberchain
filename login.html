<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DocSec — Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root {
  --primary: #4361ee;
  --secondary: #3a0ca3;
  --success: #4cc9f0;
  --warning: #f72585;
  --dark: #1a1a2e;
  --gray: #6c757d;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

body {
  background: linear-gradient(135deg, #0f0c29, #24243e, #1a1a2e);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  padding: 20px;
}

.card {
  background: rgba(26, 26, 46, 0.92);
  padding: 38px;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  width: 380px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  text-align: center;
}

.card h1 {
  font-size: 28px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 10px;
}

.card p { color: var(--gray); margin-bottom: 18px; font-size: 14px; }

label { text-align: left; display: block; margin-bottom: 6px; font-size: 14px; color: var(--success); }

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  color: white;
  margin-bottom: 14px;
  transition: .3s;
  font-size: 15px;
}
input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(67,97,238,0.25);
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border: none;
  font-weight: 600;
  font-size: 15px;
  color: white;
  cursor: pointer;
  transition: .3s;
}
button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(67,97,238,0.35); }

#message { margin-top: 10px; font-size: 14px; }

#resend-otp { margin-top: 6px; font-size: 13px; color: var(--warning); cursor: pointer; display: none; }

.link {
  margin-top: 14px;
  font-size: 14px;
  color: var(--success);
  cursor: pointer;
  display: inline-block;
}
</style>

</head>
<body>
<div class="card">

  <h1><i class="fas fa-shield-alt"></i> DocSec Login</h1>
  <p>Enter your username & password. OTP will be sent to your email.</p>

  <div id="message"></div>

  <label>Username</label>
  <input id="username" type="text" placeholder="your username" />

  <label>Password</label>
  <input id="password" type="password" placeholder="your password" />

  <div id="otp-area" style="display:none;">
    <label>Enter OTP</label>
    <input id="otp" type="text" placeholder="6-digit code" />
  </div>

  <button id="action-btn" type="button">Login</button>
  <div id="resend-otp">Resend OTP</div>

  <div class="link" id="go-register">No account? Register</div>
</div>

<script>
const BASE_URL = "http://127.0.0.1:8000";

const actionBtn = document.getElementById("action-btn");
const usernameEl = document.getElementById("username");
const passwordEl = document.getElementById("password");
const otpArea = document.getElementById("otp-area");
const otpEl = document.getElementById("otp");
const message = document.getElementById("message");
const goRegister = document.getElementById("go-register");
const resendBtn = document.getElementById("resend-otp");

let state = "idle";

actionBtn.addEventListener("click", async () => {
  message.textContent = "";

  if (state === "idle") {
    const username = usernameEl.value.trim();
    const password = passwordEl.value;
    if (!username || !password) { message.textContent = "Enter username & password"; return; }

    actionBtn.disabled = true;
    actionBtn.textContent = "Sending OTP...";

    try {
      const resp = await fetch(BASE_URL + "/login", {
        method: "POST",
        body: new URLSearchParams({ username, password })
      });
      const j = await resp.json();

      if (resp.ok && j.status==="ok") {
        state = "waiting_otp";
        otpArea.style.display = "block";
        resendBtn.style.display = "block";
        actionBtn.textContent = "Verify OTP";
        message.textContent = "OTP sent to your email.";
      } else {
        message.textContent = j.message || "Login failed";
        actionBtn.textContent = "Login";
      }
    } catch {
      message.textContent = "Network error";
      actionBtn.textContent = "Login";
    } finally { actionBtn.disabled = false; }

  } else if (state === "waiting_otp") {
    const username = usernameEl.value.trim();
    const code = otpEl.value.trim();
    if (!code) { message.textContent = "Enter OTP"; return; }

    actionBtn.disabled = true;
    actionBtn.textContent = "Verifying...";

    try {
      const resp = await fetch(BASE_URL + "/verify-login-otp", {
        method: "POST",
        body: new URLSearchParams({ username, otp: code })
      });
      const j = await resp.json();

      if (resp.ok && j.status==="ok") {
        localStorage.setItem("username", username);
        const role = (j.role || "").toLowerCase();
        if (role === "admin") location.href = "./admin.html";
        else location.href = "./home.html";
      } else {
        message.textContent = j.message || "OTP verify failed";
        actionBtn.textContent = "Verify OTP";
      }
    } catch {
      message.textContent = "Network error";
      actionBtn.textContent = "Verify OTP";
    } finally { actionBtn.disabled = false; }
  }
});

goRegister.addEventListener("click", () => { location.href = "./register.html"; });
resendBtn.addEventListener("click", () => { actionBtn.click(); });
</script>

</body>
</html>
