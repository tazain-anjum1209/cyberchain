<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocSec — Create Account</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root {
  --primary: #4361ee;
  --secondary: #3a0ca3;
  --success: #4cc9f0;
  --warning: #f72585;
  --dark: #1a1a2e;
  --gray: #6c757d;
}

* {
  margin: 0; padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background: linear-gradient(135deg, #0f0c29, #24243e, #1a1a2e);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  color: white;
}

.container {
  width: 100%;
  max-width: 420px;
  background: rgba(26, 26, 46, 0.92);
  border-radius: 16px;
  padding: 40px 34px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  text-align: center;
}

.logo {
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex; justify-content: center; align-items: center; gap: 10px;
}

.tagline {
  font-size: 14px; opacity: .85; margin-bottom: 24px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: var(--success);
  margin: 12px 0 6px 0;
  text-align: left;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.07);
  color: white;
  transition: .3s;
  font-size: 15px;
}

input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 6px rgba(67,97,238,0.4);
  outline: none;
}

button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  color: white;
  cursor: pointer;
  margin-top: 18px;
  transition: .3s;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(67,97,238,0.35);
}

#message {
  margin-top: 15px;
  font-size: 14px;
}

.link {
  margin-top: 16px;
  font-size: 14px;
  color: var(--success);
  cursor: pointer;
  display: inline-block;
}

#resend-otp {
  margin-top: 10px;
  font-size: 13px;
  color: var(--warning);
  cursor: pointer;
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo"><i class="fas fa-user-plus"></i> DOCSEC</div>
  <div class="tagline">Create your secure document vault account</div>

  <div id="message"></div>

  <label><i class="fas fa-user"></i> Username</label>
  <input id="username" type="text" placeholder="Choose a username">

  <label><i class="fas fa-lock"></i> Password</label>
  <input id="password" type="password" placeholder="Choose a password">

  <label><i class="fas fa-envelope"></i> Email</label>
  <input id="email" type="email" placeholder="your.email@example.com">

  <div id="otp-area" style="display:none;">
    <label><i class="fas fa-key"></i> Enter OTP</label>
    <input id="otp" type="text" placeholder="6-digit code">
  </div>

  <button id="action-btn">Register</button>
  <div id="resend-otp">Resend OTP</div>
  <div class="link" id="go-login">Already have an account? Login</div>

</div>

<script>
const BASE_URL = "http://127.0.0.1:8000";

const actionBtn = document.getElementById("action-btn");
const usernameEl = document.getElementById("username");
const passwordEl = document.getElementById("password");
const emailEl = document.getElementById("email");
const otpArea = document.getElementById("otp-area");
const otpEl = document.getElementById("otp");
const message = document.getElementById("message");
const goLogin = document.getElementById("go-login");
const resendBtn = document.getElementById("resend-otp");

let state = "idle";

actionBtn.addEventListener("click", async () => {
  message.textContent = "";
  if (state === "idle") {
    const username = usernameEl.value.trim();
    const password = passwordEl.value;
    const email = emailEl.value.trim();
    if (!username || !password || !email) { message.textContent = "Fill all fields"; return; }
    actionBtn.disabled = true;
    actionBtn.textContent = "Sending OTP...";
    try {
      const resp = await fetch(BASE_URL + "/register", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ username, password, email })
      });

      const j = await resp.json();
      if (resp.ok && j.status==="ok") {
        state = "waiting_otp";
        otpArea.style.display = "block";
        resendBtn.style.display = "block";
        actionBtn.textContent = "Verify OTP";
        message.textContent = "OTP sent — Enter it to complete registration";
      } else {
        message.textContent = j.message || "Registration failed";
        actionBtn.textContent = "Register";
      }
    } catch (e) {
      message.textContent = "Network error";
      actionBtn.textContent = "Register";
    } finally {
      actionBtn.disabled = false;
    }
  } else if (state === "waiting_otp") {
    const username = usernameEl.value.trim();
    const code = otpEl.value.trim();
    if (!code) { message.textContent = "Enter OTP"; return; }
    actionBtn.disabled = true;
    actionBtn.textContent = "Verifying...";
    try {
      const resp = await fetch(BASE_URL + "/verify-register-otp", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ username, otp: code })
      });

      const j = await resp.json();
      if (resp.ok && j.status==="ok") {
        message.textContent = "✅ Registration complete! Redirecting...";
        actionBtn.textContent = "Done";
        setTimeout(() => { window.location.href = "login.html"; }, 1200);
      } else {
        message.textContent = j.message || "OTP verify failed";
        actionBtn.textContent = "Verify OTP";
      }
    } catch (e) {
      message.textContent = "Network error";
      actionBtn.textContent = "Verify OTP";
    } finally {
      actionBtn.disabled = false;
    }
  }
});

goLogin.addEventListener("click", () => { window.location.href = "login.html"; });
resendBtn.addEventListener("click", () => { actionBtn.click(); });
</script>

</body>
</html>
